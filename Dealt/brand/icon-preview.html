<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:600 18px -apple-system,system-ui,sans-serif;display:flex;gap:0}
.col{flex:1;padding:36px;display:flex;flex-direction:column;align-items:center;gap:26px}
.light{background:#e9e7f2;color:#333}.dark{background:#000;color:#ddd}.tint{background:#1b1206;color:#ddd}
img{border-radius:22.37%;display:block}
.big{width:300px;height:300px}.row{display:flex;gap:22px;align-items:flex-end}
.m{width:120px;height:120px}.s{width:60px;height:60px}.xs{width:40px;height:40px}
.tint img{filter:grayscale(1) sepia(1) saturate(4) hue-rotate(-5deg) brightness(1.1)}
</style></head><body>
<div class="col light"><div>Light</div><img class="big" src="png/AppIcon.png"><div class="row"><img class="m" src="png/AppIcon.png"><img class="s" src="png/AppIcon.png"><img class="xs" src="png/AppIcon.png"></div></div>
<div class="col dark"><div>Dark</div><img class="big" src="png/AppIcon-Dark.png"><div class="row"><img class="m" src="png/AppIcon-Dark.png"><img class="s" src="png/AppIcon-Dark.png"><img class="xs" src="png/AppIcon-Dark.png"></div></div>
<div class="col tint"><div>Tinted (simulated)</div><img class="big" src="png/AppIcon-Tinted.png"><div class="row"><img class="m" src="png/AppIcon-Tinted.png"><img class="s" src="png/AppIcon-Tinted.png"><img class="xs" src="png/AppIcon-Tinted.png"></div></div>
</body></html>
