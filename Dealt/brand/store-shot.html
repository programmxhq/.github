<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Nunito;src:url(fonts/Nunito.ttf);font-weight:200 1000}
html,body{margin:0;width:1320px;height:2868px;overflow:hidden}
body{background:linear-gradient(#2D2667,#141030);font-family:Nunito;color:#FFF8EC;position:relative}
.glow{position:absolute;left:-200px;right:-200px;top:1500px;height:1800px;border-radius:50%;
  background:radial-gradient(closest-side,var(--c),transparent);opacity:.35}
.cap{position:absolute;top:190px;left:90px;right:90px;text-align:center}
.dots{display:flex;gap:18px;justify-content:center;margin-bottom:46px}
.dots i{width:30px;height:30px;border-radius:50%;display:block;opacity:.35}
.dots i.on{opacity:1;transform:scale(1.25)}
h1{text-wrap:balance;font-weight:900;font-size:112px;line-height:1.04;letter-spacing:-1.5px;margin:0}
p{text-wrap:balance;font-weight:700;font-size:54px;line-height:1.25;margin:34px 0 0;color:rgba(255,248,236,.72)}
.phone{position:absolute;left:128px;top:760px;width:1020px;padding:22px;border-radius:118px;background:#0B0920;
  box-shadow:0 40px 120px rgba(0,0,0,.55), inset 0 0 0 3px rgba(255,255,255,.12)}
.phone img{width:100%;display:block;border-radius:96px}
</style></head><body>
<div class="glow"></div>
<div class="cap">
  <div class="dots"><i style="background:#34C759"></i><i style="background:#FF2D55"></i><i style="background:#007AFF"></i><i style="background:#FF9500"></i><i style="background:#5856D6"></i></div>
  <h1 id="h"></h1><p id="s"></p>
</div>
<div class="phone"><img id="img"></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('h').textContent = q.get('h');
document.getElementById('s').textContent = q.get('s');
document.getElementById('img').src = q.get('img');
const colors = ['#34C759','#FF2D55','#007AFF','#FF9500','#5856D6'];
const stage = +q.get('stage');
document.querySelectorAll('.dots i')[stage].classList.add('on');
document.body.style.setProperty('--c', colors[stage]);
</script>
</body></html>
