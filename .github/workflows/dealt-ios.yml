name: Dealt iOS

on:
  push:
    paths:
      - "Dealt/**"
      - ".github/workflows/dealt-ios.yml"
  pull_request:
    paths:
      - "Dealt/**"
      - ".github/workflows/dealt-ios.yml"
  workflow_dispatch:

concurrency:
  group: dealt-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Dealt
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Content lint
        run: python3 tools/contentlint.py

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          for rt in reversed(ios):
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project Dealt.xcodeproj \
            -scheme Dealt \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/Dealt.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          STATUS=$?
          grep -E "error:|warning: .*/Dealt/|Test .*(passed|failed)|✔|✘|\*\* (BUILD|TEST)" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -300
          tail -40 "$RUNNER_TEMP/xcodebuild.log"
          exit $STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealt-xcodebuild
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/Dealt.xcresult
          if-no-files-found: ignore
