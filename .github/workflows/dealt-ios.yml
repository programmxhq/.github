name: Dealt iOS

on:
  push:
    branches: [main]
    paths:
      - "Dealt/**"
      - ".github/workflows/dealt-ios.yml"
  pull_request:
    paths:
      - "Dealt/**"
      - ".github/workflows/dealt-ios.yml"
  workflow_dispatch:

concurrency:
  group: dealt-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Xcode ${{ matrix.xcode }} / iOS ${{ matrix.ios }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "16"
            ios: "18"
            device: "iPhone"
          # 6.9" device: its UI-test screenshots are App Store sized (1320x2868).
          - xcode: "26"
            ios: "26"
            device: "iPhone 17 Pro Max"
    defaults:
      run:
        working-directory: Dealt
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Content lint
        run: python3 tools/contentlint.py

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          major, wanted = sys.argv[1], sys.argv[2]
          d = json.load(sys.stdin)["devices"]
          key = lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")]
          ios = sorted((k for k in d if "iOS-" + major + "-" in k), key=key)
          for rt in reversed(ios):
              for dev in d[rt]:
                  if dev["name"] == wanted or (wanted == "iPhone" and dev["name"].startswith("iPhone")):
                      print(dev["udid"]); sys.exit()
          sys.exit("no " + wanted + " simulator for iOS " + major)
          ' "${{ matrix.ios }}" "${{ matrix.device }}")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
          # Clean status bar for screenshots.
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project Dealt.xcodeproj \
            -scheme Dealt \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/Dealt.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          STATUS=$?
          grep -E "error:|warning: .*/Dealt/|Test .*(passed|failed)|\*\* (BUILD|TEST)" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -300
          tail -40 "$RUNNER_TEMP/xcodebuild.log"
          exit $STATUS

      - name: Export screenshots
        if: always()
        run: |
          OUT="$RUNNER_TEMP/screenshots"
          mkdir -p "$OUT"
          [ -d "$RUNNER_TEMP/Dealt.xcresult" ] || exit 0
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Dealt.xcresult" --output-path "$OUT" || exit 0
          python3 - "$OUT" <<'PY'
          import json, os, sys
          out = sys.argv[1]
          for test in json.load(open(os.path.join(out, "manifest.json"))):
              for a in test.get("attachments", []):
                  src = os.path.join(out, a["exportedFileName"])
                  name = a.get("suggestedHumanReadableName", a["exportedFileName"]).split("_0_")[0]
                  if os.path.exists(src):
                      os.rename(src, os.path.join(out, name + os.path.splitext(src)[1]))
          PY
          ls "$OUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealt-xcode${{ matrix.xcode }}-ios${{ matrix.ios }}
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/Dealt.xcresult
          if-no-files-found: ignore
